# Documentation-only Docker Compose example.
# It is intentionally incomplete and contains no real image versions,
# passwords, paths, ports, API keys, or volume names from the live system.

services:
  postgres:
    image: <POSTGRES_IMAGE_AND_VERSION>
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - compreface-postgres-data:/var/lib/postgresql/data
    networks:
      - compreface-internal

  compreface:
    image: <COMPREFACE_IMAGE_AND_VERSION>
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "127.0.0.1:<LOCAL_COMPREFACE_PORT>:80"
    networks:
      - compreface-internal

volumes:
  compreface-postgres-data:

networks:
  compreface-internal:
    driver: bridge

# PostgreSQL should not be published to the public internet.
# If a service must be remotely administered, use the private Tailscale network.