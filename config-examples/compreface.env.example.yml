# Sanitised CompreFace environment example.
# Copy privately to .env and replace every placeholder.

POSTGRES_USERNAME=<POSTGRES_USERNAME>
POSTGRES_PASSWORD=<POSTGRES_PASSWORD>
POSTGRES_DB=<POSTGRES_DATABASE>
POSTGRES_DOMAIN=postgres
POSTGRES_PORT=5432

# Disable services that are not required for the prototype.
ENABLE_EMAIL_SERVER=false

# Review privacy consequences before enabling image storage.
SAVE_IMAGES_TO_DB=<TRUE_OR_FALSE>

# Tune for the available Ghost hardware only after measurement.
COMPREFACE_API_JAVA_OPTIONS=-Xmx1g
COMPREFACE_ADMIN_JAVA_OPTIONS=-Xmx1g